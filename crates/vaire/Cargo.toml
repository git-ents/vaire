[package]
name = "vaire"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Requirement records in AsciiDoc: extract, emit, check"

[lints]
workspace = true

[dependencies]
acdc-parser = { git = "https://github.com/nlopes/acdc", version = "0.9.0" }
anstream = "1"
anstyle = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "vaire"
path = "src/main.rs"
